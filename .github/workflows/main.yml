name: Deploy to Teacher Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnose aaPanel Connection
        run: |
          echo "Checking aaPanel endpoint..."

          curl -sS -v \
            --connect-timeout 10 \
            --max-time 15 \
            -o /dev/null \
            -w '\nHTTP status: %{http_code}\n' \
            http://103.171.84.81:25181/ || true

      - name: Trigger aaPanel Webhook
        uses: tunnaduong/aapanel-deploy-action@v1.0
        with:
          panel_url: http://103.171.84.81:25181
          webhook_key: ${{ secrets.AAPANEL_WEBHOOK_KEY }}
