name: Deploy to Teacher Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger aaPanel Webhook
        run: |
          curl -k -X POST "https://103.171.84.81:25181/hook?key=${{ secrets.AAPANEL_WEBHOOK_KEY }}"
